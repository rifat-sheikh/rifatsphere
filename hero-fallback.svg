<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb9a6"/>
      <stop offset=".5" stop-color="#efe0b4"/>
      <stop offset="1" stop-color="#f6d79c"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1dfae"/>
      <stop offset="1" stop-color="#b9cfb4"/>
    </linearGradient>
    <linearGradient id="fieldA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8db95f"/>
      <stop offset="1" stop-color="#5e9647"/>
    </linearGradient>
    <linearGradient id="fieldB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5e9647"/>
      <stop offset="1" stop-color="#2f6e3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d6" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff6d6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="fieldClip"><path d="M0 640 L1600 640 L1600 900 L0 900 Z"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
